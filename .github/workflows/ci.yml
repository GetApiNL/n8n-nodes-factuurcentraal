name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # TODO: commit a package-lock.json, then switch to `npm ci` and add `cache: npm` above.
      - run: npm install --no-audit --no-fund

      - run: npm run lint

      - run: npm run build
